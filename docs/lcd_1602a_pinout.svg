<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" role="img" aria-label="Standard 1602A HD44780 16-pin pinout: 1 VSS ground, 2 VDD supply, 3 VO contrast, 4 RS, 5 RW, 6 E, 7-10 D0-D3 unused in 4-bit mode, 11-14 D4-D7 data bus, 15 A backlight anode, 16 K backlight cathode.">
<style>svg{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}text{fill:#17191a}.cap{font-weight:700;font-size:20px}.note{fill:#5b625e;font-size:12px}.n{font-weight:700;font-size:13px}.fn{font-size:12.5px}.used{fill:#13a34a}.pwr{fill:#d8352a}.gnd{fill:#2b2b2b}</style>
