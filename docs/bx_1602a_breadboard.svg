<text class="cap" x="34" y="38">TinyFPGA BX + 1602A — breadboard wiring</text>
<text class="note" x="36" y="60">Pins verified against the design (BX.ice) and pins.pcf. Everything 3.3 V. Clock = on-board 16 MHz (not wired).</text>
