<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 860" role="img" aria-label="Breadboard wiring between a TinyFPGA BX and a 1602A LCD. BX pin 1 to LCD pin 4 (RS), pin 2 to pin 6 (E), pin 3 to pin 5 (RW), pins 4-7 to pins 11-14 (D4-D7). BX 3.3V and the LCD VDD/backlight go to the + rail, BX GND and LCD VSS/backlight to the - rail, and a 10k pot sets VO on LCD pin 3.">
<style>svg{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}text{fill:#17191a}.cap{font-weight:700;font-size:23px}.note{fill:#5b625e;font-size:13px}.pn{fill:#44474a;font-size:11px}.wn{font-weight:700;font-size:11px}.leg{font-size:12.5px}</style>
